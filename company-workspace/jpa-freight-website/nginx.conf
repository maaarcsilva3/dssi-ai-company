server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind host proxy at /dev/jpa-marketing-website/ — never emit
    # absolute Location: http://host/services/ (drops the public prefix).
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
