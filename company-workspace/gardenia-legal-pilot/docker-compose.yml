# Temporary IP-root deploy (default): http://<host>:8094/ — no nginx required.
#
# CEO path on server: copy project (include app/starter.db) → docker compose up --build -d
#
# Flip-back to /dev/gardenia-legal-pilot (+ host nginx later):
#   docker compose -f docker-compose.yml -f docker-compose.nginx-subpath.yml up --build -d
#
# Legacy prebuilt ./dist run-only (no server build): docker-compose.dist-run.yml

services:
  gardenia-legal-pilot:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ""
    image: gardenia-legal-pilot:local
    container_name: gardenia-legal-pilot
    ports:
      - "8094:80"
    environment:
      NODE_ENV: production
      PORT: "80"
      HOSTNAME: "0.0.0.0"
      DATABASE_PATH: /data/gardenia.db
      COOKIE_PATH: /
      FEATURE_DIGITAL_ROUTING: "false"
      AI_ENABLED: "true"
      NODE_OPTIONS: --experimental-sqlite
    volumes:
      - gardenia-legal-pilot-data:/data
    restart: unless-stopped

volumes:
  gardenia-legal-pilot-data: