# Run-only on server: needs prebuilt Linux ./dist (see scripts/build-dist.sh). No build: context here.
# Host nginx: proxy_pass http://127.0.0.1:8094; (no trailing slash — preserve Next.js basePath).
services:
  gardenia-legal-pilot:
    image: node:20-bookworm-slim
    container_name: gardenia-legal-pilot
    working_dir: /app
    entrypoint: ["/app/docker-entrypoint.sh"]
    ports:
      - "8094:80"
    environment:
      NODE_ENV: production
      PORT: "80"
      HOSTNAME: "0.0.0.0"
      DATABASE_PATH: /data/gardenia.db
      COOKIE_PATH: /dev/gardenia-legal-pilot
      FEATURE_DIGITAL_ROUTING: "false"
      AI_ENABLED: "true"
    volumes:
      - ./dist:/app:ro
      - gardenia-legal-pilot-data:/data
    restart: unless-stopped

volumes:
  gardenia-legal-pilot-data: